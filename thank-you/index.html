  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#09070F">
  <title>Thank You | Musik and Film</title>
  <link rel="icon" type="image/webp" href="../optimized/mrp-logo.webp">
  <style>
    @font-face {
      font-family: "DM Sans";
      src: url("../fonts/DMSans-Regular.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: "DM Sans";
      src: url("../fonts/DMSans-Medium.ttf") format("truetype");
      font-weight: 500;
      font-display: swap;
    }

    @font-face {
      font-family: "DM Sans";
      src: url("../fonts/DMSans-Bold.ttf") format("truetype");
      font-weight: 700;
      font-display: swap;
    }

    :root {
      --purple: #6B2FB8;
      --purple-light: #9B63E5;
      --purple-dark: #542296;
      --ink: #09070F;
      --panel: #151020;
      --line: #2A203B;
      --white: #FFFFFF;
      --muted: #D3D3D3;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      color: var(--white);
      background:
        radial-gradient(circle at 50% 22%, rgba(107, 47, 184, .23), transparent 36%),
        var(--ink);
      font-family: "DM Sans", sans-serif;
    }

    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .ambient::before,
    .ambient::after {
      content: "";
      position: absolute;
      width: 420px;
      aspect-ratio: 1;
      border: 1px solid rgba(155, 99, 229, .16);
      border-radius: 50%;
      animation: drift 9s ease-in-out infinite alternate;
    }

    .ambient::before {
      top: -230px;
      left: -160px;
    }

    .ambient::after {
      right: -190px;
      bottom: -250px;
      animation-delay: -4s;
    }

    .card {
      position: relative;
      width: min(100%, 660px);
      padding: clamp(40px, 7vw, 72px) clamp(24px, 7vw, 64px) 40px;
      overflow: hidden;
      text-align: center;
      background: linear-gradient(145deg, rgba(26, 21, 37, .98), rgba(15, 11, 23, .98));
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 35px 90px rgba(0, 0, 0, .48), 0 0 55px rgba(107, 47, 184, .1);
      animation: cardIn .75s cubic-bezier(.2, .8, .2, 1) both;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--purple-light), transparent);
    }

    .logo {
      position: absolute;
      top: 22px;
      left: 24px;
      width: 54px;
      height: 54px;
      object-fit: contain;
      opacity: .86;
    }

    .success-mark {
      position: relative;
      display: grid;
      width: 96px;
      height: 96px;
      margin: 10px auto 30px;
      place-items: center;
      color: var(--white);
      background: linear-gradient(145deg, var(--purple-light), var(--purple-dark));
      border-radius: 50%;
      box-shadow: 0 0 0 12px rgba(107, 47, 184, .11), 0 18px 42px rgba(107, 47, 184, .32);
      animation: markIn .65s .3s cubic-bezier(.17, .89, .32, 1.35) both;
    }

    .success-mark::before,
    .success-mark::after {
      content: "";
      position: absolute;
      inset: -18px;
      border: 1px solid rgba(155, 99, 229, .3);
      border-radius: 50%;
      animation: pulse 2s 1s ease-out infinite;
    }

    .success-mark::after {
      animation-delay: 2s;
    }

    .check {
      width: 42px;
      height: 24px;
      margin-top: -7px;
      border-bottom: 5px solid currentColor;
      border-left: 5px solid currentColor;
      transform: rotate(-45deg);
      animation: checkIn .38s .72s ease-out both;
    }

    .eyebrow {
      margin: 0 0 13px;
      color: var(--purple-light);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3.8rem);
      line-height: 1.08;
      letter-spacing: -.04em;
    }

    .message {
      max-width: 500px;
      margin: 20px auto 30px;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.12rem);
      line-height: 1.7;
    }

    .redirect {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0;
      color: #BFB6CB;
      font-size: .9rem;
    }

    .count {
      display: inline-grid;
      width: 29px;
      height: 29px;
      place-items: center;
      color: var(--white);
      background: rgba(107, 47, 184, .25);
      border: 1px solid rgba(155, 99, 229, .42);
      border-radius: 50%;
      font-weight: 700;
    }

    .progress-track {
      width: min(100%, 350px);
      height: 4px;
      margin: 24px auto 26px;
      overflow: hidden;
      background: rgba(255, 255, 255, .08);
      border-radius: 20px;
    }

    .progress {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, var(--purple-dark), var(--purple-light));
      border-radius: inherit;
      transform-origin: left;
      animation: countdown 5s linear forwards;
    }

    .site-link {
      color: var(--white);
      font-size: .86rem;
      text-underline-offset: 4px;
      text-decoration-color: var(--purple-light);
      transition: color .2s ease;
    }

    .site-link:hover {
      color: var(--purple-light);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes markIn {
      from { opacity: 0; transform: scale(.45) rotate(-12deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }

    @keyframes checkIn {
      from { opacity: 0; transform: rotate(-45deg) scale(.35); }
      to { opacity: 1; transform: rotate(-45deg) scale(1); }
    }

    @keyframes pulse {
      0% { opacity: .8; transform: scale(.7); }
      100% { opacity: 0; transform: scale(1.38); }
    }

    @keyframes drift {
      to { transform: translate(35px, 25px) scale(1.08); }
    }

    @keyframes countdown {
      to { transform: scaleX(0); }
    }

    @media (max-width: 520px) {
      body { padding: 16px; }
      .card { border-radius: 22px; }
      .logo {
        top: 18px;
        left: 18px;
        width: 42px;
        height: 42px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
  <noscript>
    <meta http-equiv="refresh" content="5;url=https://musikandfilm.com">
  </noscript>
</head>
<body>

  <div class="ambient" aria-hidden="true"></div>
  <main class="card">
    <img class="logo" src="../optimized/mrp-logo.webp" alt="Musik and Film">
    <div class="success-mark" aria-hidden="true">
      <span class="check"></span>
    </div>
    <p class="eyebrow">Submission received</p>
    <h1>Thank you.<br>Your lead was submitted.</h1>
    <p class="message">
      Your information is safely on its way to our team. We appreciate your interest and look forward to
      learning more about your music and where you want to take it.
    </p>
    <p class="redirect" aria-live="polite">
      Taking you to our main website in <span class="count" id="countdown">5</span> seconds
    </p>
    <div class="progress-track" aria-hidden="true">
      <div class="progress"></div>
    </div>
    <a class="site-link" href="https://musikandfilm.com">Continue to musikandfilm.com now</a>
  </main>

  <script>
    (() => {
      const destination = "https://musikandfilm.com";
      const countdown = document.getElementById("countdown");
      let seconds = 5;

      const timer = window.setInterval(() => {
        seconds -= 1;
        countdown.textContent = Math.max(seconds, 0);

        if (seconds <= 0) {
          window.clearInterval(timer);
          window.location.replace(destination);
        }
      }, 1000);
    })();
  </script>
</body>
</html>
